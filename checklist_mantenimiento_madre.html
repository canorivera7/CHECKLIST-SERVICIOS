const meta=[['Número de equipo',equipment.numeroEquipo],['Tipo',machineLabel],['Marca',equipment.marca],['Modelo',equipment.modelo],['Serie',equipment.serie],['Horas',answers.hours]];return <!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro ${esc(pm)} ${esc(machineLabel)}</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7f3;color:#17251d;font:14px Arial,sans-serif}.sheet{max-width:900px;margin:24px auto;background:white;padding:42px;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 16px 45px #133c2418}.sheet:before{content:"";position:absolute;width:520px;height:180px;right:-150px;top:-75px;border-radius:50%;background:#dff2e5;transform:rotate(-14deg)}.sheet:after{content:"";position:absolute;width:480px;height:130px;left:-220px;bottom:160px;border-radius:50%;border:24px solid #edf8f0}.header{position:relative;z-index:1;border-bottom:2px solid #64b77c;padding-bottom:18px;margin-bottom:22px}.brand-lockup{display:flex;align-items:center;gap:13px}.brand-lockup svg{width:54px;height:54px;flex:none}.logo{font-size:18px;letter-spacing:.25em;color:#177344;font-weight:700}.tagline{font-size:9px;letter-spacing:.18em;color:#42594a;margin-top:4px;text-transform:uppercase}.title{font-size:30px;color:#135f36;margin:12px 0 5px}.sub{color:#63746a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 26px;position:relative;z-index:1}.meta{background:#f3faf5;border:1px solid #d8ebde;border-radius:16px;padding:12px}.meta small{display:block;color:#6f8175;margin-bottom:5px}.meta b{font-size:14px}section{position:relative;z-index:1;margin:22px 0}h2{font-size:17px;color:#197344;border-bottom:1px solid #dceee1;padding:0 0 8px 12px;border-left:4px solid #70c48a;border-radius:0 0 0 10px}article{margin:10px 0;padding:14px 16px;border-radius:15px;background:#fbfdfb;border:1px solid #e4eee7;display:grid;grid-template-columns:1fr auto;gap:7px 12px}article p,article ul,.photos{grid-column:1/-1;margin:0}article>img{grid-column:1/-1;display:block;width:145px;height:115px;object-fit:cover;border-radius:12px;border:1px solid #dde9df}.status{padding:4px 10px;border-radius:20px;font-weight:bold}.good{background:#e2f5e8;color:#14723a}.bad{background:#fff0e8;color:#ac4817}ul{padding-left:20px}.photos{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}figure{margin:0;width:145px}figure img{display:block;width:145px;height:115px;object-fit:cover;border-radius:12px;border:1px solid #dde9df}figcaption,small{font-size:11px;color:#68796e;margin-top:4px}.signature-img{grid-column:1/-1;max-width:240px;max-height:85px;object-fit:contain;object-position:left}.foot{margin-top:28px;padding-top:12px;border-top:1px solid #e1eee5;color:#78887d;font-size:11px}.print{position:fixed;right:24px;top:20px;padding:12px 18px;border:0;border-radius:14px;background:#167440;color:white;font-weight:bold}@media print{body{background:#fff}.sheet{margin:0 auto;box-shadow:none;border-radius:0;padding:24px}.print{display:none}section,article{break-inside:avoid}.sheet:before,.sheet:after{-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media(max-width:600px){.sheet{margin:0;padding:22px 16px;border-radius:0}.grid{grid-template-columns:repeat(2,1fr)}article{padding:12px}}</style></head><body><button class="print" onclick="window.print()">Imprimir / Guardar PDF</button><main class="sheet"><header class="header"><div class="brand-lockup"><svg viewBox="0 0 140 110" xmlns="http://www.w3.org/2000/svg" aria-label="Logo Cari Lift"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12v28m90-28v28M25 18h90M25 27h90M25 39h90" stroke="#42c832" stroke-width="5"/><path d="M38 40 105 56 38 72 105 88 38 102M105 40 38 56 105 72 38 88 105 102" stroke="#42c832" stroke-width="5"/><path d="M25 11v29M115 11v29" stroke="#42c832" stroke-width="6"/></g><path d="M30 30h80v9H30z" fill="#9aa39e"/></svg><div><div class="logo">CARI LIFT</div><div class="tagline">Tu altura, nuestra especialidad</div></div></div><h1 class="title">Servicio de mantenimiento ${esc(pm)} · ${esc(machineLabel)}</h1></header><div class="grid">${meta.map(([k,v])=><div class="meta"><small>${esc(k)}</small><b>${esc(v||'—')}</b></div>).join('')}</div>${blocks}<div class="foot">Registro generado el ${esc(dateText())} · Equipo ${esc(equipment.numeroEquipo||'—')} · ${esc(pm)} ${esc(machineLabel)}</div></main></body></html>}
async function submitChecklist(){const btn=sEl.querySelector('[data-action="next"]');if(btn){btn.disabled=true;btn.textContent='Enviando…'}try{const htmlChecklist=await reportHtml();const payload={htmlChecklist,rowId.rowId,rowIdEquipo.rowId,numeroEquipo.numeroEquipo,horas.hours,fechaServicio(),fechaServicioTexto(),inspector.inspector,comentarios.comments||'',tipoChecklist,tipoServicio,tipoEquipo,tipoMaquina,marca.marca,modelo.modelo,serie.serie,htmlVersion:'mantenimiento-madre-v1.3'};const body=new URLSearchParams();for(const [k,v] of Object.entries(payload))body.set(k,String(v??''));await fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});step=finalIndex;render()}catch(err){console.error(err);alert('No se pudo preparar el envío. Revisa tu conexión e inténtalo de nuevo.');if(btn){btn.disabled=false;btn.textContent='Enviar checklist'}}}
function handleAction(act){if(act==='next'){saveCurrent();const err=validate();if(err){alert(err);return}if(step===closeIndex){submitChecklist();return}step++;render();return}if(act==='back'){saveCurrent();step=Math.max(0,step-1);render();return}if(act==='clear-sign'){signatureData='';signatureDrawn=false;initSign();return}}
let lastPointerAction=0;
sEl.addEventListener('pointerup',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;lastPointerAction=Date.now();handleAction(button.dataset.action)});
sEl.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const group=choice.dataset.choice;sEl.querySelectorAll([data-choice="${group}"]).forEach(b=>b.classList.remove('selected'));choice.classList.add('selected');const itemIndex=step-itemStart;if(step>=itemStart&&step<closeIndex){const s=activeSpecs[itemIndex],id='p'+(itemIndex+1);if(s.panel){saveCurrent();render()}else{saveCurrent();const selected=sEl.querySelector([data-choice="${group}"].selected)?.dataset.value;if(group===id+'-status'&&selected==='Problema'&&!sEl.querySelector('.issue-box'))render();else if(group===id+'-status'&&selected!=='Problema'&&sEl.querySelector('.issue-box'))render()}}if(group==='charge'){saveCurrent();render()}else if(group.endsWith('-parts')){saveCurrent();render()}syncContinueButton();return}const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;if(Date.now()-lastPointerAction<700){lastPointerAction=0;return}handleAction(act)});
sEl.addEventListener('change',e=>{if(e.target.id==='hours')answers.hours=e.target.value;if(e.target.id==='inspector'){answers.inspector=e.target.value;render()}if(e.target.id==='comments')answers.comments=e.target.value;if(e.target.id.endsWith('-count')){const id=e.target.id.replace('-count','');answers[id+'-count']=e.target.value;render()}if(e.target.dataset.file!==undefined){const f=e.target.files?.[0];if(f){files[e.target.id]=f;if(photoUrls[e.target.id])URL.revokeObjectURL(photoUrls[e.target.id]);photoUrls[e.target.id]=URL.createObjectURL(f);const p=document.getElementById('prev-'+e.target.id);if(p){p.innerHTML=<img src="${photoUrls[e.target.id]}" alt="Vista previa">;const label=p.closest('.photo-card')?.querySelector('label');if(label)label.remove()}}}syncContinueButton()});
sEl.addEventListener('input',e=>{if(e.target.dataset.valueKey)answers[e.target.dataset.valueKey]=e.target.value;if(e.target.id==='hours')answers.hours=e.target.value;if(e.target.id==='comments')answers.comments=e.target.value;syncContinueButton()});
if(!pm||!machine){document.querySelector('.progress-container').style.display='none';sEl.innerHTML=<div class="blocked"><b>No pude identificar el checklist desde el link.</b><br><br>Incluye <code>tipoChecklist=PM1</code> o <code>PM2</code> y <code>tipoEquipo=tijera-electrica</code>, <code>tijera-combustion</code>, <code>brazo-electrico</code> o <code>brazo-combustion</code>.</div>}else{render()}
</script></body></html>
